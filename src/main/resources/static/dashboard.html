<!DOCTYPE html>
<html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Dashboard</title><link rel="stylesheet" href="css/style.css"></head>
<body><nav><a class="logo" href="index.html">Job<span>Connect</span></a><div><a href="index.html">Home</a><a href="jobs.html">Jobs</a><a href="post-job.html">Post Job</a><a href="#" onclick="logout()">Logout</a></div></nav>
<section class="container"><h1 id="welcome">Dashboard</h1><div class="stats"><div><b id="count">0</b><span>Applications</span></div><div><b>100+</b><span>Jobs</span></div><div><b>50+</b><span>Companies</span></div></div><h2>My Applications</h2><div id="apps" class="card"></div></section>
<script>let u=JSON.parse(localStorage.user||"null");if(!u)location.href="login.html";else{welcome.textContent="Welcome, "+u.name;fetch("/api/applications/user/"+u.id).then(r=>r.json()).then(a=>{count.textContent=a.length;apps.innerHTML=a.length?a.map(x=>`<p><b>${x.applicantName}</b> — ${x.email} — <span class="badge">${x.status}</span></p>`).join(""):"<p>No applications yet.</p>"})}function logout(){localStorage.removeItem("user");location.href="index.html"}</script></body></html>
