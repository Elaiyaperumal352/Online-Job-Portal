<!DOCTYPE html>
<html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Post Job</title><link rel="stylesheet" href="css/style.css"></head>
<body><nav><a class="logo" href="index.html">Job<span>Connect</span></a><div><a href="index.html">Home</a><a href="jobs.html">Find Jobs</a><a href="login.html">Login</a></div></nav>
<div class="auth wide"><div class="card"><h1>Post a Job</h1><form id="form"><input id="title" placeholder="Job Title" required><input id="company" placeholder="Company Name" required><input id="location" placeholder="Location" required><select id="jobType"><option>Full Time</option><option>Part Time</option><option>Internship</option><option>Remote</option></select><input id="salary" placeholder="Salary e.g. ₹4-7 LPA"><input id="skills" placeholder="Required Skills"><textarea id="description" rows="6" placeholder="Job Description"></textarea><button class="button">Publish Job</button></form></div></div>
<script>form.onsubmit=e=>{e.preventDefault();fetch("/api/jobs",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({title:title.value,company:company.value,location:location.value,jobType:jobType.value,salary:salary.value,skills:skills.value,description:description.value})}).then(r=>{if(r.ok){alert("Job posted");location.href="jobs.html"}else alert("Error posting job")})}</script></body></html>
