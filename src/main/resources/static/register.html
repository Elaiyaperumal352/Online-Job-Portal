<!DOCTYPE html>
<html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Register</title><link rel="stylesheet" href="css/style.css"></head>
<body><nav><a class="logo" href="index.html">Job<span>Connect</span></a><div><a href="index.html">Home</a><a href="jobs.html">Find Jobs</a><a href="login.html">Login</a></div></nav>
<div class="auth"><div class="card"><h1>Create Account</h1><form id="form"><input id="name" placeholder="Full Name" required><input id="email" type="email" placeholder="Email" required><input id="password" type="password" placeholder="Password" required><select id="role"><option value="JOB_SEEKER">Job Seeker</option><option value="RECRUITER">Recruiter</option></select><button class="button">Register</button></form><p id="msg"></p></div></div>
<script>form.onsubmit=e=>{e.preventDefault();fetch("/api/users/register",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({name:name.value,email:email.value,password:password.value,role:role.value})}).then(async r=>{let d=await r.json().catch(()=>null);if(r.ok){alert("Registration successful");location.href="login.html"}else msg.textContent=d||"Registration failed"})}</script></body></html>
